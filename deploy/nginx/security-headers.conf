# 天健湖 · nginx 安全响应头（片段，供 server / location 通过 include 引入）
#
# 为什么静态资源也要单独加：
#   index.html 与 /assets/* 由 nginx 直接返回，不经过 FastAPI，
#   应用层的安全头对它们无效。而 HTML 正是 XSS 的入口，必须补上。
#
# 注意：/api/ 由 FastAPI 返回，安全头由应用层（app/core/security.py）设置，
# 这里不要重复加，否则同一个头会出现两次。两边的 CSP 需要保持一致。

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
