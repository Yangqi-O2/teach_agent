# 天健湖 · nginx 站点配置（macOS / Homebrew 版）
#
# 安装方式（推荐用脚本，会自动替换占位符并备份原配置）：
#     python3 deploy/install_nginx.py --domain example.com
#
# 手工安装：把下面所有 <占位符> 换成实际值后，覆盖 /opt/homebrew/etc/nginx/nginx.conf
# Linux 请改用同目录的 tianjianhu.linux.conf。
#
# 说明见 docs/DEPLOY.md。

worker_processes  1;

# Homebrew 不会自动建日志目录：mkdir -p /opt/homebrew/var/log/nginx
error_log  /opt/homebrew/var/log/nginx/error.log warn;
pid        /opt/homebrew/var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /opt/homebrew/var/log/nginx/access.log;

    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 64m;          # 教材上传（Word/PPT/PDF/EPUB）

    # 不回显版本号，减少指纹信息
    server_tokens   off;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # 登录 / 注册限流：同一 IP 每分钟 10 次，突发 20 次。
    # 应用层还有按「用户名 + IP」的失败计数，两层互补。
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_status 429;

    upstream tianjianhu_backend {
        server 127.0.0.1:8787;
        keepalive 16;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  <DOMAIN>;

        # —— 认证接口：单独限流 + 转发 ——
        location ~ ^/api/(auth/login|auth/register)$ {
            limit_req          zone=auth_zone burst=20 nodelay;
            proxy_pass         http://tianjianhu_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # —— 其余接口：全部转发给 FastAPI ——
        location /api/ {
            proxy_pass         http://tianjianhu_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # SSE（任务进度 / 教材问答流式输出）：必须关掉缓冲
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
        }

        # —— 前端静态文件 ——
        root <SITE_ROOT>/apps/web/dist;

        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            # 静态资源由 nginx 直接返回，安全头必须在 nginx 侧补
            include <SITE_ROOT>/deploy/nginx/security-headers.conf;
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
            include <SITE_ROOT>/deploy/nginx/security-headers.conf;
        }

        # 隐藏文件一律拒绝（.env / .git / .DS_Store）
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # —— 上 HTTPS 后启用这一段，并把上面 80 端口改成 301 跳转 ——
    #
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    #     server_name <DOMAIN>;
    #
    #     ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     # HSTS 由应用层下发（TJH_HSTS_SECONDS），nginx 侧不重复设置
    #     # 其余 location 与上面的 80 端口 server 块保持一致
    # }
}
